<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Rifa Automator</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="data:," />
</head>
<body>
  <header class="app-header">
    <h1>Rifa Automator</h1>
    <nav class="tabs">
      <button class="tab" data-tela="config" aria-selected="true">Login</button>
      <button class="tab" data-tela="manual" aria-selected="false">Manual</button>
      <button class="tab" data-tela="importar" aria-selected="false">Importar</button>
      <button class="tab" data-tela="progresso" aria-selected="false">Progresso</button>
      <button class="tab" data-tela="historico" aria-selected="false">Histórico</button>
    </nav>
  </header>

  <div id="login-badge" class="login-badge" hidden></div>

  <main>
    <section id="tela-pin" class="tela" hidden>
      <div class="card">
        <h2>Acesso protegido por PIN</h2>
        <label>PIN
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="new-password" />
        </label>
        <button id="btn-pin" class="btn btn-primary">Entrar</button>
        <div id="pin-status" class="status" role="status"></div>
      </div>
    </section>

    <section id="tela-config" class="tela">
      <div id="env-aviso" class="avisos" hidden>
        <strong>Conta configurada via ambiente</strong>
        <p class="dica" id="env-limite"></p>
      </div>
      <form id="form-config" autocomplete="off">
        <label>CPF da conta
          <input id="cfg-cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required />
        </label>
        <label>Senha
          <input id="cfg-senha" name="senha" type="password" autocomplete="new-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Salvar e testar login</button>
        <div id="cfg-status" class="status" role="status"></div>
      </form>
    </section>

    <section id="tela-manual" class="tela" hidden>
      <form id="form-manual" class="card" autocomplete="off">
        <h2>Adicionar pessoa</h2>
        <label>Nome
          <input id="m-nome" name="nome" required />
        </label>
        <label>CPF
          <input id="m-cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" required />
        </label>
        <label>Telefone
          <input id="m-tel" name="telefone" inputmode="numeric" placeholder="(00) 00000-0000" required />
        </label>
        <label>E-mail
          <input id="m-email" name="email" type="email" inputmode="email" required />
        </label>
        <label>Rifas (qtd)
          <input id="m-qtd" name="qtd" type="number" inputmode="numeric" min="1" max="100" step="1" value="1" required />
        </label>
        <div class="botoes-job">
          <button type="submit" class="btn btn-primary">Adicionar</button>
          <button type="button" class="btn" id="btn-limpar">Limpar lista</button>
        </div>
        <div id="m-status" class="status" role="status"></div>
      </form>
      <div class="card">
        <h2>Lista <span id="m-total" class="dica"></span></h2>
        <ul id="m-lista" class="linhas"></ul>
        <button id="btn-criar" class="btn btn-primary" disabled>Criar job</button>
        <div id="m-criar-status" class="status" role="status"></div>
      </div>
    </section>

    <section id="tela-importar" class="tela" hidden>
      <div class="card">
        <h2>1. Escolha um arquivo</h2>
        <input id="arq" type="file" accept=".csv,.xlsx,.xls" />
        <p class="dica">Formato: Nome;CPF;Telefone;E-mail;Qtd (CSV) ou .xlsx</p>
      </div>
      <div class="card">
        <h2>2. …ou cole a tabela</h2>
        <textarea id="colar" rows="6" placeholder="Nome;CPF;Telefone;E-mail;Qtd
Maria;867.301.690-87;(11) 98765-4321;maria@x.com;1"></textarea>
      </div>
      <button id="btn-importar" class="btn btn-primary">Importar</button>
      <div id="import-status" class="status" role="status"></div>
      <div id="avisos" class="avisos" hidden></div>
    </section>

    <section id="tela-progresso" class="tela" hidden>
      <div class="resumo" id="resumo">
        <div>Total: <b id="r-total">0</b></div>
        <div class="ok">OK: <b id="r-ok">0</b></div>
        <div class="erro">Erros: <b id="r-erro">0</b></div>
        <div>Pendentes: <b id="r-pend">0</b></div>
      </div>
      <div class="botoes-job">
        <button id="btn-iniciar" class="btn btn-primary">Iniciar</button>
        <button id="btn-cancelar" class="btn">Pausar</button>
        <button id="btn-reproc" class="btn">Reprocessar erros</button>
      </div>
      <div id="job-header" class="card"></div>
      <ul id="linhas" class="linhas"></ul>
      <div id="logs" class="logs" hidden></div>
    </section>

    <section id="tela-historico" class="tela" hidden>
      <div class="card">
        <h2>Histórico de jobs</h2>
        <ul id="historico-lista" class="linhas historico"></ul>
      </div>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
